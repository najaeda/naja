# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  apt_packages:
    - cmake
    - ninja-build
    - libboost-dev
    - libtbb-dev
    - capnproto
    - libcapnp-dev
    - zlib1g-dev
    - bison
    - flex
  tools:
    python: "3.12"
  jobs:
    post_install:
      # Build this revision, including the extension used by autodoc.
      - python -m pip install . --config-settings=cmake.define.PREGENERATED_PARSER_SOURCES=OFF --config-settings=build.tool-args=-j2

submodules:
  include: all
  recursive: true

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: src/najaeda/najaeda/docs/source/conf.py

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: src/najaeda/najaeda/docs/requirements.txt