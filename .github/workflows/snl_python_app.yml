name: naja_python_app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release
  NAJA_INSTALL: ${{ github.workspace }}/naja-install

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev

    - name: Set up canonical Linux Release toolchain
      uses: ./.github/actions/setup-linux-release
      with:
        cache-scope: full

    - name: Configure canonical Release build
      run: bash .github/scripts/configure-linux-release.sh

    - name: Build Naja Release tree
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Run Naja test suite
      working-directory: ${{github.workspace}}/build
      run: ctest --parallel $(nproc) -VV -C ${{env.BUILD_TYPE}}

    - name: Prepare Python snippet workspace
      run: |
           mkdir -p ${{env.NAJA_INSTALL}}
           mkdir -p ${{github.workspace}}/najapythonapp

    - name: Copy Python snippet app
      working-directory: ${{github.workspace}}/najapythonapp
      run: |
           cp ${{github.workspace}}/src/nl/snippets/python/naja_snippet.py .

    - name: Install Naja Release tree
      working-directory: ${{github.workspace}}/build
      run: make install

    - name: Run Python snippet app
      working-directory: ${{github.workspace}}/najapythonapp
      env:
        LD_LIBRARY_PATH: ${{env.LD_LIBRARY_PATH}}:${{env.NAJA_INSTALL}}/lib
        PYTHONPATH: ${{env.PYTHONPATH}}:${{env.NAJA_INSTALL}}/lib/python
      run: python3 naja_snippet.py

    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
