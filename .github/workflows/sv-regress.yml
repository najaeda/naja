name: External SV Regress

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sv-regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev iverilog

      - name: Set up canonical Linux Release toolchain
        uses: ./.github/actions/setup-linux-release
        with:
          cache-scope: naja-module

      - name: Set up Borg tools Python
        uses: actions/setup-python@v7
        id: borg-python
        with:
          python-version: "3.13"
          update-environment: false

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml fusesoc

      - name: Install Borg generation and simulation tools
        env:
          BORG_TOOLS_PYTHON: ${{ steps.borg-python.outputs.python-path }}
          BORG_PYTHON: ${{ runner.temp }}/borg-tools/bin/python
          BORG_MILL: ${{ runner.temp }}/borg-bin/mill
        run: |
          "${BORG_TOOLS_PYTHON}" -m venv "${RUNNER_TEMP}/borg-tools"
          "${BORG_PYTHON}" -m pip install -r regress/sv/cases/borg/requirements.txt
          mkdir -p "${RUNNER_TEMP}/borg-bin"
          curl -L --fail --retry 3 \
            https://repo.maven.apache.org/maven2/com/lihaoyi/mill-dist/1.1.2/mill-dist-1.1.2-mill.sh \
            -o "${BORG_MILL}"
          chmod +x "${BORG_MILL}"
          ln -s "${RUNNER_TEMP}/borg-tools/bin/cocotb-config" "${RUNNER_TEMP}/borg-bin/cocotb-config"
          echo "${RUNNER_TEMP}/borg-bin" >> "${GITHUB_PATH}"
          echo "BORG_PYTHON=${BORG_PYTHON}" >> "${GITHUB_ENV}"
          echo "BORG_MILL=${BORG_MILL}" >> "${GITHUB_ENV}"

      - name: Install Bender
        run: cargo install bender

      - name: Configure canonical Release build
        run: bash .github/scripts/configure-linux-release.sh

      - name: Build najaeda Python extension
        run: cmake --build ${{ github.workspace }}/build --target naja --config Release --parallel $(nproc)

      - name: Prepare najaeda Python package for script execution
        run: |
          mkdir -p ${{ github.workspace }}/build/test/najaeda
          cp -R \
            ${{ github.workspace }}/src/najaeda/najaeda \
            ${{ github.workspace }}/build/test/najaeda/
          ln -sf ${{ github.workspace }}/build/src/nl/python/naja_wrapping/naja.so \
            ${{ github.workspace }}/build/test/najaeda/najaeda/naja.so

      - name: Run external SV regress lint
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case ibex --case cv32e40p --stage lint

      - name: Run Borg load, dump, lint, and cocotb simulation
        run: >-
          python3 ${{ github.workspace }}/regress/sv/sv_regress.py run
          --case borg
          --stage load_dump
          --stage lint
          --stage borg_cocotb_sim
          --require-firmware-sim-tools

      - name: Run Z-Core load, dump, lint, and simulation
        run: >-
          python3 ${{ github.workspace }}/regress/sv/sv_regress.py run
          --case zcore
          --stage load_dump
          --stage lint
          --stage github_sim

      - name: Run AXI cut regress (lint + simulation)
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case axi

      - name: Run large external SV load and dump checks
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case black_parrot --stage load_dump

      - name: Run CVA6 load, dump, and logic-cone signatures
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case cva6 --stage load_dump --stage logic_cones

      - name: Upload SV regress artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sv-regress-artifacts
          path: ${{ github.workspace }}/build/sv-regress

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
