name: External SV Regress

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #29).
# Only naja.so itself moves to Bazel here -- sv_regress.py's own
# subprocess/najaeda-import plumbing is untouched, since it just expects
# a populated build/test/najaeda/ directory (DEFAULT_NAJAEDA_PATH),
# regardless of what built naja.so or put it there.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sv-regress:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        # libboost-dev/libtbb-dev: still needed even though naja's own
        # Boost usage is vendored -- see ubuntu-build.yml's comment on
        # this same step (slang's nested CMake build needs a real system
        # Boost; oneTBB has no BCR module and is pkg-config-wrapped).
        # capnproto/libcapnp-dev dropped -- see
        # internal/bazel-migration-plan.md's CI apt dependency audit
        # (naja-if's schema codegen is fully hermetic under Bazel).
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            libboost-dev libfl-dev libtbb-dev \
            bison flex m4 pkg-config python3-dev git
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml fusesoc

      - name: Install bender
        run: cargo install bender

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build naja Python module
        # Runs after "Set up Python" above so bazel/thirdparty/python/
        # repo.bzl's python3-config PATH search resolves to this job's
        # actual Python 3.12, matching the original CMake job's explicit
        # -DPython3_EXECUTABLE=$(which python3) -- not whatever system
        # python happens to be on PATH otherwise.
        run: bazel build //src/nl/python/naja_wrapping:naja.so --jobs=auto

      - name: Prepare najaeda Python package for script execution
        run: |
          mkdir -p ${{ github.workspace }}/build/test/najaeda
          cp -R \
            ${{ github.workspace }}/src/najaeda/najaeda \
            ${{ github.workspace }}/build/test/najaeda/
          ln -sf ${{ github.workspace }}/bazel-bin/src/nl/python/naja_wrapping/naja.so \
            ${{ github.workspace }}/build/test/najaeda/najaeda/naja.so

      - name: Run external SV regress lint
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case ibex --case cv32e40p --stage lint

      - name: Run Z-Core load, dump, lint, and simulation
        run: >-
          python3 ${{ github.workspace }}/regress/sv/sv_regress.py run
          --case zcore
          --stage load_dump
          --stage lint
          --stage github_sim

      - name: Run AXI cut regress (lint + simulation)
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case axi

      - name: Run large external SV load and dump checks
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case black_parrot --stage load_dump

      - name: Run CVA6 load, dump, and logic-cone signatures
        run: python3 ${{ github.workspace }}/regress/sv/sv_regress.py run --case cva6 --stage load_dump --stage logic_cones

      - name: Upload SV regress artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sv-regress-artifacts
          path: ${{ github.workspace }}/build/sv-regress
