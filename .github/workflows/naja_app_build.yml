name: naja_app_build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release
  NAJA_INSTALL: ${{ github.workspace }}/naja-install

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
        submodules: true

    - name: Install build dependencies
      run: sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev

    - name: Set up canonical Linux Release toolchain
      uses: ./.github/actions/setup-linux-release
      with:
        cache-scope: full

    - name: Configure canonical Release build
      run: bash .github/scripts/configure-linux-release.sh

    - name: Build Naja Release tree
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Run Naja test suite
      working-directory: ${{github.workspace}}/build
      run: ctest --parallel $(nproc) -VV -C ${{env.BUILD_TYPE}}

    - name: Prepare C++ snippet workspace
      run: |
           mkdir -p ${{env.NAJA_INSTALL}}
           mkdir -p ${{github.workspace}}/naja_app

    - name: Install Naja Release tree
      working-directory: ${{github.workspace}}/build
      run: make install

    - name: Copy C++ snippet app
      working-directory: ${{github.workspace}}/naja_app
      run: cp -R ${{github.workspace}}/src/app_snippet .

    - name: Configure snippet app
      working-directory: ${{github.workspace}}/naja_app/app_snippet
      run: cmake -B ${{github.workspace}}/naja_app/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build snippet app
      run: cmake --build ${{github.workspace}}/naja_app/build --config ${{env.BUILD_TYPE}} --parallel $(nproc)

    - name: Run C++ snippet app
      working-directory: ${{github.workspace}}/naja_app/build/src
      env:
        LD_LIBRARY_PATH: ${{env.LD_LIBRARY_PATH}}:${{env.NAJA_INSTALL}}/lib
      run: ./naja_app

    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
