name: tutorials regression

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #28).
# Only the najaeda extension itself is Bazel-built here (notebooks are
# pure Python, no other compiled artifact is invoked) -- reuses the same
# build-naja.so-then-copy-into-a-scratch-dir setup already established
# for najaeda-test.yml's coverage step, since running Jupyter notebooks
# via `pytest --nbmake` isn't itself a Bazel sandboxed action.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      # No `submodules: true` -- Bazel fetches naja-if/naja-verilog/slang
      # itself (MODULE.bazel), doesn't use the thirdparty/ checkouts.

    - name: Install system dependencies
      # libboost-dev/libtbb-dev: still needed even though naja's own
      # Boost usage is vendored -- see ubuntu-build.yml's comment on this
      # same step (slang's nested CMake build needs a real system Boost;
      # oneTBB has no BCR module and is pkg-config-wrapped).
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          libboost-dev libfl-dev libtbb-dev \
          bison flex m4 pkg-config python3-dev git graphviz

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Run najaeda tests
      run: bazel test //test/najaeda:najaeda_python_tests --test_output=errors --jobs=auto

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.13'

    - name: Install Python dependencies
      run: pip install nbmake nbstripout pandas matplotlib 'fusesoc>=2.4'

    - name: Clone and set up ibex
      env:
        XDG_CACHE_HOME: /tmp/fusesoc_cache
      run: |
        mkdir -p /tmp/ibex && cd /tmp/ibex
        git init
        git remote add origin https://github.com/lowRISC/ibex.git
        git fetch --depth 1 origin eede2fbbef007d53cafbd85d937b897751c40a54
        git checkout FETCH_HEAD
        fusesoc --cores-root /tmp/ibex run \
          --target=lint \
          --setup \
          --build-root /tmp/ibex/build/fusesoc \
          --mapping=lowrisc:prim_generic:all:0.1 \
          lowrisc:ibex:ibex_top

    - name: Strip notebook outputs before execution
      run: nbstripout tutorials/notebooks/*.ipynb

    - name: Build naja.so and set up najaeda env for notebooks
      run: |
        bazel build //src/nl/python/naja_wrapping:naja.so --jobs=auto
        mkdir -p /tmp/najaeda-tutorials-env/najaeda
        cp -R src/najaeda/najaeda/. /tmp/najaeda-tutorials-env/najaeda/
        cp bazel-bin/src/nl/python/naja_wrapping/naja.so /tmp/najaeda-tutorials-env/najaeda/naja.so

    - name: Run tutorials
      env:
        PYTHONPATH: /tmp/najaeda-tutorials-env
        NAJAEDA_TUTORIALS_BENCHMARKS: ${{github.workspace}}/tutorials/benchmarks
        IBEX_REPO: /tmp/ibex
      run: pytest --nbmake tutorials/notebooks/
