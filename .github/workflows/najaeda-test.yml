name: najaeda test, coverage and lint

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #28).
#
# The hermetic `bazel test` run is the real pass/fail gate: it drives
# //test/najaeda:najaeda_python_tests, which replicates
# setup_test_env.cmake's copy-najaeda-sources + symlink-naja.so dance
# inside run_najaeda_tests.sh (its own scratch dir per test run, not
# shared with any other target). najaeda-examples.yml covers
# //src/najaeda/examples:najaeda_examples separately, matching that
# workflow's pre-existing split from this one.
#
# Coverage/lint still run outside Bazel, same as before this migration:
# flake8 needs no build at all, and `python -m coverage run -m
# unittest` needs to import the *uninstrumented* najaeda sources
# directly from a plain directory (Bazel's own sandboxed copy above is
# torn down after that test action, not reachable from a later step),
# so this job builds naja.so once with `bazel build` and reuses the
# same copy-plus-symlink setup by hand to point coverage at real,
# on-disk sources -- same env vars CMakeLists.txt's ENVIRONMENT string
# used to set.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      # No `submodules: true` -- Bazel fetches naja-if/naja-verilog/slang
      # itself (MODULE.bazel), doesn't use the thirdparty/ checkouts.

    - name: Install dependencies
      # libboost-dev/libtbb-dev: still needed even though naja's own
      # Boost usage is vendored -- see ubuntu-build.yml's comment on this
      # same step (slang's nested CMake build needs a real system Boost;
      # oneTBB has no BCR module and is pkg-config-wrapped).
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          libboost-dev libfl-dev libtbb-dev \
          bison flex m4 pkg-config python3-dev git

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        # Hardcoded, not `${{ github.workflow }}` like the other Bazel
        # workflows: this workflow's own `name:` is "najaeda test,
        # coverage and lint", and its literal comma broke setup-bazel's
        # cache key (actions/cache keys can't contain commas) -- seen
        # live on CI as a `ValidationError: ... cannot contain commas`
        # plus a `ReferenceError: name is not defined` inside
        # setup-bazel@0.19.0's own restoreCache path.
        disk-cache: najaeda-test
        repository-cache: true

    - name: Test (hermetic, via Bazel)
      run: bazel test //test/najaeda:najaeda_python_tests --test_output=errors --jobs=auto

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: 3.13
    - name: Install lint/coverage tooling
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install "coverage>=7.2"
    - name: Lint with flake8
      working-directory: ${{github.workspace}}/src/najaeda
      run: flake8 --max-line-length=100 --ignore E128,W504,W503 --exclude docs,examples,native_examples,README

    - name: Build naja.so for coverage run
      run: bazel build //src/nl/python/naja_wrapping:naja.so --jobs=auto
    - name: Set up najaeda coverage env
      run: |
        mkdir -p /tmp/najaeda-coverage-env/najaeda
        cp -R src/najaeda/najaeda/. /tmp/najaeda-coverage-env/najaeda/
        cp bazel-bin/src/nl/python/naja_wrapping/naja.so /tmp/najaeda-coverage-env/najaeda/naja.so
    - name: Run najaeda testing with coverage
      working-directory: ${{github.workspace}}/test/najaeda
      env:
        PYTHONPATH: /tmp/najaeda-coverage-env
        LIBERTY_BENCHMARKS_PATH: ${{github.workspace}}/test/nl/formats/liberty/benchmarks
        VERILOG_BENCHMARKS_PATH: ${{github.workspace}}/test/nl/formats/verilog/benchmarks
        NAJAEDA_TEST_PATH: /tmp/najaeda-coverage-env
        NAJAEDA_SOURCE_TEST_PATH: ${{github.workspace}}/test/najaeda
      run: |
        python -m coverage run -m unittest && python -m coverage xml --rcfile=./.coveragerc
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      if: github.repository == 'najaeda/naja' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        directory: ${{github.workspace}}/test/najaeda/
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
