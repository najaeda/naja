name: Ubuntu Bazel Build

# Source builds use the same naja-if checkout as CMake. BCR compatibility
# is validated separately by bazel-registered.yml.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
    - uses: actions/checkout@v7

    - name: Initialize shared source dependency
      run: git submodule update --init thirdparty/naja-if thirdparty/naja-verilog

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}
        repository-cache: true

    - name: Build
      # --jobs=auto: Bazel already parallelizes across all local cores by
      # default (unlike make/CMake's default serial build) -- spelled out
      # explicitly here for clarity/predictability rather than because
      # it's functionally required.
      run: bazel build //... --jobs=auto

    - name: Check netlist determinism
      run: bazel test //test/najaeda:najaeda_determinism_tests --test_output=errors

    - name: Test
      run: bazel test //... --test_output=errors --jobs=auto
