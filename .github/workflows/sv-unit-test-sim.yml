name: SV Unit Test Simulation

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #29).
# Only naja.so itself moves to Bazel here -- everything downstream
# (PYTHONPATH-based najaeda import, verilator simulation via Docker) is
# unchanged.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sv-unit-test-sim:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install build dependencies
      # libboost-dev/libtbb-dev: still needed even though naja's own
      # Boost usage is vendored -- see ubuntu-build.yml's comment on this
      # same step (slang's nested CMake build needs a real system Boost;
      # oneTBB has no BCR module and is pkg-config-wrapped).
      # capnproto/libcapnp-dev dropped -- see
      # internal/bazel-migration-plan.md's CI apt dependency audit
      # (naja-if's schema codegen is fully hermetic under Bazel).
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          libboost-dev libfl-dev libtbb-dev \
          bison flex m4 pkg-config python3-dev git

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Build naja Python module
      # Runs after "Set up Python" above so bazel/thirdparty/python/
      # repo.bzl's python3-config PATH search resolves to this job's
      # actual Python 3.12, matching the original CMake job's explicit
      # -DPython3_EXECUTABLE=$(which python3) -- not whatever system
      # python happens to be on PATH otherwise.
      run: bazel build //src/nl/python/naja_wrapping:naja.so --jobs=auto

    - name: Prepare najaeda Python package for script execution
      run: |
        mkdir -p ${{ github.workspace }}/build/test/najaeda
        cp -R ${{ github.workspace }}/src/najaeda/najaeda ${{ github.workspace }}/build/test/najaeda/
        ln -sf ${{ github.workspace }}/bazel-bin/src/nl/python/naja_wrapping/naja.so \
          ${{ github.workspace }}/build/test/najaeda/najaeda/naja.so

    - name: Generate Verilog from SystemVerilog with najaeda
      env:
        PYTHONPATH: ${{ github.workspace }}/build/test/najaeda
      run: |
        python3 ${{ github.workspace }}/test/nl/formats/systemverilog/benchmarks/generate_najaeda_verilog.py

    - name: Simulate SV benchmarks
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          --entrypoint /bin/bash \
          verilator/verilator:v5.046 \
          -c 'set -euo pipefail
              cd /work/test/nl/formats/systemverilog/benchmarks
              for bench in \
                simple \
                up_counter \
                param_inst \
                binary_ops_supported \
                byte_ports \
                implicit_width_ports \
                port_directions \
                non_ansi_ports \
                model_reuse \
                unary_not \
                unary_not_binary_supported \
                seq_add_out_plus_one \
                seq_add_one_plus_out \
                seq_enable_else_default \
                seq_enable_bus1_supported \
                seq_preincrement_supported \
                seq_reset_only_supported \
                seq_reset_all_zero_literal_wide_supported \
                seq_list_single_wrapper_supported \
                seq_nested_begin_wrapper_supported \
                seq_concurrent_assertion_ignored \
                seq_timing_event_list_negedge_reset_supported \
                seq_binary_non_add \
                seq_add_non_increment \
                seq_rhs_unresolved \
                seq_rhs_width_mismatch \
                seq_rhs_direct_match \
                packed_struct_enum_ports \
                fixed_unpacked_array_variable \
                unsupported_generic_type; do
                make -C "$bench" clean
                make -C "$bench" sim
              done'

    - name: Simulate generated Verilog benchmarks
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/work \
          --entrypoint /bin/bash \
          verilator/verilator:v5.022 \
          -c 'set -euo pipefail
              cd /work/test/nl/formats/systemverilog/benchmarks
              primitives_sv=../najaeda_primitives.v
              for bench in \
                simple \
                up_counter \
                param_inst \
                binary_ops_supported \
                byte_ports \
                implicit_width_ports \
                port_directions \
                non_ansi_ports \
                model_reuse \
                unary_not \
                unary_not_binary_supported \
                seq_add_out_plus_one \
                seq_add_one_plus_out \
                seq_enable_else_default \
                seq_enable_bus1_supported \
                seq_preincrement_supported \
                seq_reset_only_supported \
                seq_reset_all_zero_literal_wide_supported \
                seq_list_single_wrapper_supported \
                seq_nested_begin_wrapper_supported \
                seq_timing_event_list_negedge_reset_supported \
                seq_rhs_direct_match \
                packed_struct_enum_ports; do
                generated_sv="${bench}_naja.v"
                make -C "$bench" clean
                make -C "$bench" sim SV="$generated_sv $primitives_sv"
              done'
