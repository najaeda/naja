name: macOS Bazel Build

# CMake is naja's primary build system -- this workflow keeps the Bazel
# side (MODULE.bazel, BUILD.bazel throughout the tree) validated. The
# Bazel build needs no host packages: every library and code generator
# comes from a Bazel module (BCR, or bazel/registry/ for the few that are
# not on BCR yet).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-26, macos-15]

    steps:
    - uses: actions/checkout@v7
      # No `submodules: true` -- Bazel doesn't use the thirdparty/
      # checkouts. dependency-sync-check.yml keeps the two build systems'
      # pins from silently drifting apart.

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}-${{ matrix.os }}
        repository-cache: true

    - name: Build
      # --jobs=auto: Bazel already parallelizes across all local cores by
      # default (unlike make/CMake's default serial build) -- spelled out
      # explicitly here for clarity/predictability rather than because
      # it's functionally required.
      run: bazel build //... --jobs=auto

    - name: Test
      run: bazel test //... --test_output=errors --jobs=auto
