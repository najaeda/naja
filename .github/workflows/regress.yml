name: regress

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  NAJA_INSTALL: ${{ github.workspace }}/naja-install

jobs:
  regress:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev rsync

    - name: Set up canonical Linux Release toolchain
      uses: ./.github/actions/setup-linux-release
      with:
        cache-scope: full

    - name: Configure canonical Release build
      run: bash .github/scripts/configure-linux-release.sh

    - name: Build and install Naja Release tree
      run: |
        cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel $(nproc)
        cmake --install ${{ github.workspace }}/build

    - name: Run megaboom regress
      run: make -C ${{ github.workspace }}/regress/designs/verilog/megaboom
      env:
        NAJA_INSTALL: ${{ env.NAJA_INSTALL }}

    - name: Show ccache statistics
      if: always()
      run: ccache --show-stats
