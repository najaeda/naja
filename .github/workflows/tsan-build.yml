name: tsan-build

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #27).
# Uses .bazelrc's `--config=tsan`, which matches CMakeLists.txt's
# ENABLE_THREAD_SANITIZER option exactly (ThreadSanitizer,
# -fno-omit-frame-pointer, -c dbg to mirror CMake's Debug build type).
# `--config=tsan` also forces test execution to run un-sandboxed
# (spawn_strategy=local) and serially (local_test_jobs=1) -- see the
# comment on those lines in .bazelrc for why.
#
# najaPythonPropertyTests is excluded from the test run, same as the old
# CMake job's `ctest -E ".*[p|P]ython.*"`.
#
# //test/najaeda:najaeda_python_tests and
# //src/najaeda/examples:najaeda_examples are excluded too (task #28),
# preemptively -- not yet independently confirmed failing here, but
# asan-build.yml hit exactly this class of problem live: under
# --config=asan, naja.so gets built sanitizer-instrumented, but these
# targets load it via a plain system `python3` never linked against the
# sanitizer runtime, so its interceptor symbols
# (`__asan_option_detect_stack_use_after_return`, and presumably the
# TSan equivalents here) can't resolve. Same fix as there: exclude rather
# than chase LD_PRELOADing a version-matched runtime.
#
# NOTE: validated locally on macOS that --config=tsan compiles and links
# every target cleanly (no code/BUILD issues). Could not validate the test
# run itself there: the resulting binary segfaults on startup before any
# test code runs, with no output at all -- macOS/Apple Silicon TSan support
# is known to be far less mature than Linux's. Needs live Ubuntu CI to
# confirm actual test results, same as valgrind.yml/coverage.yml.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      # libboost-dev/libtbb-dev: still needed even though naja's own
      # Boost usage is vendored -- see ubuntu-build.yml's comment on this
      # same step (slang's nested CMake build needs a real system Boost;
      # oneTBB has no BCR module and is pkg-config-wrapped).
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          libboost-dev libfl-dev libtbb-dev \
          bison flex m4 pkg-config python3-dev git clang

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: Resolve newest available clang
      # See asan-build.yml's comment on this same step: forces the newest
      # clang-N already on the runner image rather than the bare `clang`
      # alias, which on some Ubuntu releases is too old for slang's use of
      # std::source_location against libstdc++.
      id: clang
      run: |
        cc="$(ls /usr/bin/clang-[0-9]* 2>/dev/null | grep -E '/clang-[0-9]+$' | sort -t- -k2 -n | tail -1)"
        [ -z "$cc" ] && cc=clang
        cxx="${cc/clang/clang++}"
        echo "cc=$cc" >> "$GITHUB_OUTPUT"
        echo "cxx=$cxx" >> "$GITHUB_OUTPUT"
        "$cc" --version

    - name: Build
      run: >
        bazel build --config=tsan
        --repo_env=CC=${{ steps.clang.outputs.cc }} --repo_env=CXX=${{ steps.clang.outputs.cxx }}
        //... --jobs=auto

    - name: Test
      env:
        # Keep TSan focused on Naja code paths and avoid TBB scheduler reports.
        NON_MT: 1
        TSAN_OPTIONS: halt_on_error=1 ignore_noninstrumented_modules=1 suppressions=${{ github.workspace }}/.github/tsan.supp
      # --test_env=NAME (no `=value`) forwards this step's env var through by
      # name -- Bazel's test actions do NOT inherit the invoking shell/CI
      # step's environment by default (see internal/bazel-migration-plan.md's
      # TSan/oneTBB finding). Without these two flags, NON_MT and
      # TSAN_OPTIONS above are silently dropped: the suppressions file is
      # never read (no suppression applied, regardless of pattern syntax)
      # and NON_MT never reaches RemoveLoadlessLogic.cpp/DNL_impl.h/
      # LogicCone.cpp, so their TBB-parallel paths run anyway.
      run: >
        bazel test --config=tsan
        --repo_env=CC=${{ steps.clang.outputs.cc }} --repo_env=CXX=${{ steps.clang.outputs.cxx }}
        --test_env=NON_MT --test_env=TSAN_OPTIONS
        --test_output=errors
        -- //... -//test/nl/python/naja_wrapping:najaPythonPropertyTests
        -//test/najaeda:najaeda_python_tests -//src/najaeda/examples:najaeda_examples
