name: Dependency sync check

# Checks source dependency selection. Registry compatibility has its own
# workflow and publication schedule; naja-if registry lag is permitted.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize shared source dependency
        run: git submodule update --init thirdparty/naja-if thirdparty/naja-verilog

      - name: Check source dependency configuration
        run: python3 ci/check_submodule_bazel_sync.py

      - name: Test dependency configuration checks
        run: python3 -m unittest discover -s ci -p test_check_submodule_bazel_sync.py
