name: run najaeda examples

# Bazel build (see internal/bazel-migration-plan.md, Phase 8, task #28).
# //src/najaeda/examples:najaeda_examples runs run_regress.py under
# run_najaeda_examples.sh, which sets up its own scratch najaeda-plus-
# naja.so directory (same approach as test/najaeda's sh_test, but its
# own independent copy).

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      # No `submodules: true` -- Bazel fetches naja-if/naja-verilog/slang
      # itself (MODULE.bazel), doesn't use the thirdparty/ checkouts.

    - name: Install dependencies
      # libboost-dev/libtbb-dev: still needed even though naja's own
      # Boost usage is vendored -- see ubuntu-build.yml's comment on this
      # same step (slang's nested CMake build needs a real system Boost;
      # oneTBB has no BCR module and is pkg-config-wrapped).
      run: |
        sudo apt-get update
        sudo apt-get install -yq \
          libboost-dev libfl-dev libtbb-dev \
          bison flex m4 pkg-config python3-dev git

    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: launch najaeda examples
      run: bazel test //src/najaeda/examples:najaeda_examples --test_output=streamed --jobs=auto
