name: PULP SV Regress

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/nl/**'
      - 'src/najaeda/**'
      - 'thirdparty/slang'
      - 'regress/sv/pulp_benchmarks.py'
      - 'regress/sv/tests/test_pulp*.py'
      - 'regress/sv/pulp_report.py'
      - 'regress/sv/ita_simulation.py'
      - 'regress/sv/tests/test_ita_simulation.py'
      - '.github/workflows/pulp-sv-regress.yml'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      survey:
        description: 'Survey all 23 variants (known failures make this job fail)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pulp-sv:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -yq ccache libboost-dev libfl-dev capnproto libcapnp-dev libtbb-dev
      - uses: ./.github/actions/setup-linux-release
        with:
          cache-scope: naja-module
      - name: Configure canonical Release build
        run: bash .github/scripts/configure-linux-release.sh
      - name: Build najaeda Python extension
        run: cmake --build build --target naja --parallel $(nproc)
      - name: Prepare Python package
        run: |
          mkdir -p build/test/najaeda
          cp -R src/najaeda/najaeda build/test/najaeda/
          ln -sf "${GITHUB_WORKSPACE}/build/src/nl/python/naja_wrapping/naja.so" build/test/najaeda/najaeda/naja.so
      - name: Test benchmark runner
        run: |
          python3 -m unittest discover -s regress/sv/tests -p 'test_pulp*.py'
          python3 -m unittest discover -s regress/sv/tests -p test_ita_simulation.py
      - name: Download pinned prepared RTL
        id: rtl
        run: |
          curl -L --fail --retry 3 \
            https://github.com/pulp-platform/eda-benchmarks/releases/download/v0.1.0/pulp-benchmarks-v0.1.0.tar.gz \
            -o "${RUNNER_TEMP}/pulp-benchmarks-v0.1.0.tar.gz"
      - name: Run PULP frontend regression
        env:
          SURVEY: ${{ inputs.survey }}
        run: |
          args=()
          if [[ "${SURVEY}" == 'true' ]]; then args+=(--all); fi
          python3 regress/sv/pulp_benchmarks.py \
            --archive "${RUNNER_TEMP}/pulp-benchmarks-v0.1.0.tar.gz" \
            --timeout 120 --lint-runner docker "${args[@]}"
      - name: Run larger-design frontend elaboration regression
        if: ${{ !cancelled() && steps.rtl.outcome == 'success' }}
        run: |
          python3 regress/sv/pulp_benchmarks.py \
            --archive "${RUNNER_TEMP}/pulp-benchmarks-v0.1.0.tar.gz" \
            --case mempool.minpool --case ita.default --case cvfpu.full --case cva6.default \
            --elaboration-only --timeout 240 \
            --output build/pulp-benchmarks/elaboration
      - name: Publish PULP job summary
        if: always()
        run: python3 regress/sv/pulp_report.py
      - name: Upload reports and generated netlists
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pulp-sv-regress
          path: build/pulp-benchmarks
          retention-days: 7
      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats
